<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <div class="bg-white rounded-2xl shadow-md w-full max-w-sm p-8">

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-800">Tec Cell Móvil</h1>
      <p class="text-slate-500 text-sm mt-1">Sistema de Órdenes de Servicio Técnico</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
        <input
          type="text"
          formControlName="usuario"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ingresa tu usuario"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      @if (errorMensaje) {
        <div class="text-red-600 text-sm bg-red-50 border border-red-200 rounded-lg px-3 py-2">
          {{ errorMensaje }}
        </div>
      }

      <button
        type="submit"
        [disabled]="form.invalid || cargando"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-medium py-2 rounded-lg transition"
      >
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>

    </form>
  </div>
</div>
